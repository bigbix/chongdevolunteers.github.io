var CSS_FILE = "3-main.css";
var JS_FILE = "4-main.js";
(function(){
  var initial = '/';
  try {
    initial = decodeURIComponent(location.hash.slice(1) || '/');
    if (initial === '/') {
      var m = location.pathname.match(/chongdevolunteers\.github\.io\/([^\/]+)\/?$/);
      if (m && ['about','gallery','volunteer','contact'].indexOf(m[1]) >= 0) {
        initial = '/' + m[1];
        try { history.replaceState(null, '', 'index.html#' + initial); } catch (e2) {}
      }
    }
  } catch (e) {}
  window.instinctFile = Object.freeze({
    initialRoute: initial,
    route: function(path){
      if (typeof path === 'string' && path.charAt(0) === '/' && path.indexOf('//') !== 0 && path.length <= 2048) {
        var target = '#' + path;
        if (location.hash !== target) history.pushState(null, '', target);
      }
    }
  });
  window.addEventListener('hashchange', function(){
    var r = '/';
    try { r = decodeURIComponent(location.hash.slice(1) || '/'); } catch (e) {}
    window.dispatchEvent(new CustomEvent('instinct-route', { detail: r }));
  });
})();
async function boot(){
  try {
    var css = await (await fetch(CSS_FILE)).text();
    css = css.replace(/url\("([A-Z0-9]+\.(?:woff2|otf|ttf))"\)/g, function(m, f){ return 'url("' + (ASSET_MAP[f] || f) + '")'; });
    var st = document.createElement('style');
    st.textContent = css;
    document.head.append(st);
    var js = await (await fetch(JS_FILE)).text();
    js = js.replace(/"\.\/([A-Z0-9]+\.(?:jpg|mp4))"/g, function(m, f){ return '"./' + (ASSET_MAP[f] || f) + '"'; });
    var s = document.createElement('script');
    s.src = URL.createObjectURL(new Blob([js], { type: 'text/javascript' }));
    document.body.append(s);
  } catch (e) {
    document.getElementById('root').textContent = 'Failed to load the site. Please refresh.';
  }
}
boot();
