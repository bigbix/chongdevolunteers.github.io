<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chongde Volunteers 崇德义工团</title>
<meta name="description" content="Chongde Volunteers 崇德义工团 - Saturday Morning Smiles at Lentor Health Nursing Home, Singapore.">
<link rel="stylesheet" href="main.css">
</head>
<body>
<div id="root"></div>
<script>
(function(){
  var initial = '/';
  try { initial = decodeURIComponent(location.hash.slice(1) || '/'); } catch (e) {}
  window.instinctFile = Object.freeze({
    initialRoute: initial,
    route: function(path){
      if (typeof path === 'string' && path.charAt(0) === '/' && path.indexOf('//') !== 0 && path.length <= 2048) {
        var target = '#' + path;
        if (location.hash !== target) history.pushState(null, '', target);
      }
    }
  });
  window.addEventListener('hashchange', function(){
    var r = '/';
    try { r = decodeURIComponent(location.hash.slice(1) || '/'); } catch (e) {}
    window.dispatchEvent(new CustomEvent('instinct-route', { detail: r }));
  });
})();
</script>
<script src="main.js"></script>
</body>
</html>
